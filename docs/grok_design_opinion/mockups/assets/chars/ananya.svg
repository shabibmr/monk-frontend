<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-label="Ananya">
  <defs>
    <linearGradient id="aBg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDE7FD"/>
      <stop offset="1" stop-color="#FCE7F3"/>
    </linearGradient>
    <linearGradient id="aHair" x1="40" y1="20" x2="120" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D2B1F"/>
      <stop offset="1" stop-color="#1A120B"/>
    </linearGradient>
    <linearGradient id="aSkin" x1="60" y1="50" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0C9A0"/>
      <stop offset="1" stop-color="#E8B88A"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#aBg)"/>
  <!-- shoulders -->
  <path d="M28 150c8-28 28-42 52-42s44 14 52 42" fill="#8F68FF"/>
  <path d="M40 150c6-18 20-28 40-28s34 10 40 28" fill="#6D3EF5"/>
  <!-- hair back -->
  <ellipse cx="80" cy="78" rx="48" ry="52" fill="url(#aHair)"/>
  <!-- neck -->
  <rect x="70" y="100" width="20" height="22" rx="8" fill="#E8B88A"/>
  <!-- face -->
  <ellipse cx="80" cy="78" rx="34" ry="38" fill="url(#aSkin)"/>
  <!-- hair front -->
  <path d="M46 70c2-28 18-44 34-44 10 0 18 4 24 12-8-2-14 2-18 10-6-12-20-14-28 2-4 8-8 14-12 20z" fill="#2A1C12"/>
  <path d="M98 42c12 6 18 22 18 36 0 4-1 8-2 12-2-14-8-24-18-30-2-8-4-14-6-18 3 0 5 0 8 0z" fill="#2A1C12"/>
  <!-- eyes -->
  <ellipse cx="68" cy="78" rx="3.2" ry="3.8" fill="#1A1A2E"/>
  <ellipse cx="92" cy="78" rx="3.2" ry="3.8" fill="#1A1A2E"/>
  <circle cx="69" cy="77" r="1" fill="#fff" opacity=".9"/>
  <circle cx="93" cy="77" r="1" fill="#fff" opacity=".9"/>
  <!-- brows -->
  <path d="M60 70c4-3 10-3 14 0" stroke="#2A1C12" stroke-width="2" stroke-linecap="round"/>
  <path d="M86 70c4-3 10-3 14 0" stroke="#2A1C12" stroke-width="2" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="62" cy="88" rx="5" ry="3" fill="#F46DB4" opacity=".28"/>
  <ellipse cx="98" cy="88" rx="5" ry="3" fill="#F46DB4" opacity=".28"/>
  <!-- smile -->
  <path d="M70 94c4 6 16 6 20 0" stroke="#C45C3E" stroke-width="2.2" stroke-linecap="round"/>
  <!-- earring -->
  <circle cx="48" cy="90" r="2.5" fill="#FFB54D"/>
</svg>
